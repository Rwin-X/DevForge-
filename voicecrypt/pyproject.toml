[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecrypt"
version = "1.0.0"
description = "Voice-bound file encryption with a Tkinter GUI (fuzzy commitment + scrypt + AES-256-GCM)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "YOUR NAME" }]
keywords = ["encryption", "cryptography", "biometrics", "voice", "fuzzy-commitment", "tkinter", "aes-gcm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
voicecrypt = "voicecrypt.gui:main"

[project.urls]
Homepage = "https://github.com/YOUR_USER/voicecrypt"
Issues = "https://github.com/YOUR_USER/voicecrypt/issues"

[tool.setuptools]
packages = ["voicecrypt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
